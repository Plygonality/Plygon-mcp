[project]
name = "plygon-blender-mcp"
version = "1.0.0"
description = "Talk to Blender from Cursor. Local MCP, no telemetry, fork-friendly."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Plygon" }]
keywords = ["blender", "mcp", "cursor", "bpy", "3d", "tech-art", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "mcp>=1.9.0,<2",
]

[project.scripts]
plygon-blender-mcp = "plygon_blender_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/EmilvanDam/plygon-mcp"
Repository = "https://github.com/EmilvanDam/plygon-mcp"
Issues = "https://github.com/EmilvanDam/plygon-mcp/issues"
Documentation = "https://github.com/EmilvanDam/plygon-mcp/tree/main/blender-mcp"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plygon_blender_mcp = ["py.typed"]
